name: Validate rules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed tool test
      - run: dart analyze
      - run: dart test
      - run: dart run tool/build_rules.dart --check
      - run: dart run tool/validate_rules.dart rules.json
